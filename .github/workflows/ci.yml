name: CI

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    # Weekly, Monday 06:00 UTC: catch a new SDK or Roslyn breaking the build early.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build-test:
    name: build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        id: setup
        with:
          dotnet-version: '10.0.x'
      - name: Pin the installed SDK
        run: dotnet new globaljson --sdk-version ${{ steps.setup.outputs.dotnet-version }} --roll-forward disable --force
      - name: Show SDK and runtimes
        run: dotnet --info
      - name: Build library
        run: dotnet build Sources/Core/Microsoft.StreamProcessing/Microsoft.StreamProcessing.csproj -c Release
      - name: Test
        run: dotnet test Sources/Test/SimpleTesting/SimpleTesting.csproj -c Release

  dotnet11-preview:
    name: build and test (.NET 11 preview SDK)
    # Move to the next major's preview channel when .NET 11 is released.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Run the net10.0 tests on the newest runtime, the .NET 11 preview, not on a 10.0 runtime.
      DOTNET_ROLL_FORWARD: LatestMajor
      DOTNET_ROLL_FORWARD_TO_PRERELEASE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        id: setup
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview
      - name: Pin the installed SDK
        run: dotnet new globaljson --sdk-version ${{ steps.setup.outputs.dotnet-version }} --roll-forward disable --force
      - name: Show SDK and runtimes
        run: dotnet --info
      - name: Build library
        run: dotnet build Sources/Core/Microsoft.StreamProcessing/Microsoft.StreamProcessing.csproj -c Release
      - name: Test
        run: dotnet test Sources/Test/SimpleTesting/SimpleTesting.csproj -c Release
